<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agence Immobilière - Portfolio</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7.22.9/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn { animation: fadeIn 1s ease-out; }
    .hover-scale:hover { transform: scale(1.05); transition: transform 0.3s; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const Header = () => (
      <header className="bg-gray-800 text-white py-6 sticky top-0 z-10 shadow-lg">
        <div className="container mx-auto flex justify-between items-center px-4">
          <h1 className="text-3xl font-bold">Agence Horizon</h1>
          <nav>
            <a href="#home" className="mx-4 hover:text-blue-400">Accueil</a>
            <a href="#properties" className="mx-4 hover:text-blue-400">Maisons</a>
            <a href="#director" className="mx-4 hover:text-blue-400">Mot de la Directrice</a>
            <a href="#about" className="mx-4 hover:text-blue-400">À Propos</a>
          </nav>
        </div>
      </header>
    );

    const Hero = () => (
      <section id="home" className="h-screen bg-cover bg-center flex items-center" style={{ backgroundImage: 'url(https://images.unsplash.com/photo-1600585154340-be6161a56a0c)' }}>
        <div className="container mx-auto text-center text-white animate-fadeIn">
          <h2 className="text-5xl font-bold mb-4">Trouvez la maison de vos rêves</h2>
          <p className="text-xl mb-6">Agence Horizon, votre partenaire immobilier depuis 10 ans.</p>
          <a href="#properties" className="bg-blue-600 text-white py-3 px-6 rounded-full hover:bg-blue-700">Voir nos maisons</a>
        </div>
      </section>
    );

    const Properties = () => {
      const houses = [
        { id: 1, title: "Villa Moderne", price: "450 000 €", location: "Côte d'Azur", bedrooms: 4, bathrooms: 3, area: "180 m²", image: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c" },
        { id: 2, title: "Maison Familiale", price: "320 000 €", location: "Provence", bedrooms: 3, bathrooms: 2, area: "140 m²", image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2" },
        { id: 3, title: "Chalet de Luxe", price: "780 000 €", location: "Alpes", bedrooms: 5, bathrooms: 4, area: "250 m²", image: "https://images.unsplash.com/photo-1570129477492-45c003edd2be" },
      ];

      return (
        <section id="properties" className="py-16 bg-gray-100">
          <div className="container mx-auto px-4">
            <h2 className="text-4xl font-bold text-center mb-12 animate-fadeIn">Nos Maisons</h2>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
              {houses.map(house => (
                <div key={house.id} className="bg-white rounded-lg shadow-lg overflow-hidden hover-scale animate-fadeIn">
                  <img src={house.image} alt={house.title} className="w-full h-48 object-cover" />
                  <div className="p-6">
                    <h3 className="text-2xl font-bold mb-2">{house.title}</h3>
                    <p className="text-blue-600 font-semibold mb-2">{house.price}</p>
                    <p className="text-gray-600 mb-2">{house.location}</p>
                    <p className="text-gray-600 mb-2">{house.bedrooms} chambres | {house.bathrooms} salles de bain | {house.area}</p>
                    <button className="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">En savoir plus</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const Director = () => (
      <section id="director" className="py-16 bg-white">
        <div className="container mx-auto px-4 flex flex-col md:flex-row items-center">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330" alt="Directrice" className="w-64 h-64 rounded-full object-cover mb-6 md:mb-0 md:mr-8 animate-fadeIn" />
          <div className="animate-fadeIn">
            <h2 className="text-4xl font-bold mb-4">Mot de la Directrice</h2>
            <p className="text-gray-600 mb-4">Bonjour, je suis Marie Dubois, directrice d'Agence Horizon. Depuis 10 ans, notre mission est d'accompagner nos clients dans la réalisation de leurs projets immobiliers avec passion et professionnalisme. Chaque maison que nous proposons est sélectionnée avec soin pour répondre à vos attentes. Faites-nous confiance pour trouver votre futur chez-vous !</p>
            <p className="text-gray-600 font-semibold">Marie Dubois</p>
          </div>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-16 bg-gray-100">
        <div className="container mx-auto px-4">
          <h2 className="text-4xl font-bold text-center mb-12 animate-fadeIn">À Propos de Nous</h2>
          <div className="text-gray-600 space-y-4 animate-fadeIn">
            <p>Agence Horizon, fondée en 2015, est une référence dans le secteur immobilier en France. Nous sommes spécialisés dans la vente de maisons de qualité, allant des villas modernes aux chalets de luxe, en passant par des maisons familiales chaleureuses.</p>
            <p>Notre vision est de transformer l'achat immobilier en une expérience fluide et agréable. Nous travaillons avec des architectes, des designers et des experts pour proposer des propriétés qui allient esthétique, confort et durabilité.</p>
            <p>Projets à venir : En 2026, nous prévoyons de lancer un programme de maisons éco-responsables dans le sud de la France, intégrant des technologies vertes pour un avenir plus durable.</p>
          </div>
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="bg-gray-800 text-white py-6">
        <div className="container mx-auto text-center">
          <p>&copy; 2025 Agence Horizon. Tous droits réservés.</p>
          <p>Contact : contact@agencehorizon.fr | +33 1 23 45 67 89</p>
        </div>
      </footer>
    );

    const App = () => (
      <div>
        <Header />
        <Hero />
        <Properties />
        <Director />
        <About />
        <Footer />
      </div>
    );

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
